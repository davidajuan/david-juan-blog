version: 2.1

# Minimal CircleCI config for LinkedIn preview -> approval -> post flow
jobs:
  generate_previews:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Install deps
          command: |
            python -m pip install --upgrade pip
            if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - run:
          name: Create previews dir and run preview generator
          command: |
            PREV_DIR=artifacts/linkedin-previews
            mkdir -p "$PREV_DIR"
            python scripts/linkedin_publish.py generate-previews --out-dir "$PREV_DIR"
      - store_artifacts:
          path: artifacts/linkedin-previews
          destination: linkedin-previews

  post_linkedin:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Install deps
          command: |
            python -m pip install --upgrade pip
            if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - run:
          name: Resolve post file from LINKEDIN_POST_FILE env var
          shell: /bin/bash -lc
          command: |
            if [ -z "${LINKEDIN_POST_FILE:-}" ]; then
              echo "LINKEDIN_POST_FILE not set; refusing to post to avoid accidental posts." >&2
              exit 1
            fi
            echo "Posting file: $LINKEDIN_POST_FILE"
            echo "POST_FILE=$LINKEDIN_POST_FILE" > /tmp/resolved_post_file.env
      - run:
          name: Post to LinkedIn
          shell: /bin/bash -lc
          command: |
            set -euo pipefail
            source /tmp/resolved_post_file.env
            python scripts/linkedin_publish.py post --file "$POST_FILE" ${COMMIT_AFTER_POST:+--commit-after-post}

workflows:
  linkedin_posting:
    triggers:
      - schedule:
          cron: "0 0 * * *"
          filters:
            branches:
              only: main
    jobs:
      - generate_previews
      - hold_for_review:
          type: approval
          requires:
            - generate_previews
      - post_linkedin:
          requires:
            - hold_for_review